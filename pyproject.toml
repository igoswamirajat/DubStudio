[project]
name = "dubstudio"
version = "0.9.0"
description = "Local-first AI dubbing studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "soundfile>=0.12.1",
  "numpy>=2.0.0",
  "httpx>=0.27.0",
  "sse-starlette>=2.1.0",
  "python-ulid>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
voice = ["omnivoice"]
audio = ["demucs"]
full = ["omnivoice", "demucs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dubstudio*"]
